<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل باصات الزرقاء - ابحث عن منطقتك</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }
        header p {
            font-size: 15px;
            opacity: 0.9;
        }
        .search-container {
            max-width: 600px;
            margin: 0 auto 30px auto;
            display: flex;
            gap: 10px;
        }
        #search-box {
            flex: 1;
            padding: 14px 20px;
            font-size: 17px;
            border: 2px solid #ddd;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        #search-box:focus {
            border-color: #007bff;
            box-shadow: 0 4px 10px rgba(0,123,255,0.2);
        }
        button {
            padding: 0 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results-container {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            gap: 20px;
        }
        .bus-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-right: 5px solid #007bff;
        }
        .bus-card h3 {
            color: #007bff;
            margin-bottom: 12px;
            font-size: 20px;
        }
        .bus-list {
            list-style-type: none;
            padding: 0;
            margin-top: 10px;
        }
        .bus-list li {
            background: #f8f9fa;
            margin-bottom: 8px;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #eee;
            font-size: 15px;
        }
        .bus-list li span {
            font-weight: bold;
            color: #e74c3c;
        }
        .no-result {
            text-align: center;
            font-size: 18px;
            color: #888;
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚍 وين بده يوديك الباص؟ - دليل الزرقاء</h1>
        <p>اكتب اسم منطقتك (مثل: الزرقاء الجديدة، عوجان، معصوم) لتظهر لك جميع الباصات والأماكن بدقة</p>
    </header>

    <div class="search-container">
        <input type="text" id="search-box" placeholder="اكتب اسم منطقتك هنا..." onkeyup="searchArea()">
        <button onclick="searchArea()">بحث</button>
    </div>

    <div class="results-container" id="results">
        <!-- ستظهر النتائج هنا -->
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; 2026 - دليل باصات الزرقاء
    </footer>

    <script>
        // قاعدة بيانات مفصلة لكل منطقة مع باصاتها والوجهات التي تذهب إليها
        const zarqaAreas = [
            {
                area: "الزرقاء الجديدة",
                station: "مجمع الحويطات / وسط البلد",
                buses: [
                    { name: "سرفيس الزرقاء الجديدة (خط 1)", dest: "مجمع البنوك، دوار السورة، المجمع التجاري" },
                    { name: "باص البتراوي الداخلي", dest: "شارع الجوهرة، مجمع الحويطات، وسط البلد" }
                ]
            },
            {
                area: "عوجان",
                station: "مجمع الأمير بشار / الشارع السكني",
                buses: [
                    { name: "باصات عوجان الكبيرة", dest: "شارع الستين، حي الأمير محمد، وسط البلد" },
                    { name: "سرفيس النزهة وعوجان", dest: "منطقة البساتين، السوق التجاري، وسط البلد" }
                ]
            },
            {
                area: "الجبل الأبيض",
                station: "مجمع الزرقاء القديم",
                buses: [
                    { name: "باصات الجبل الأبيض", dest: "شارع الملك حسين، المحطة، وسط البلد" },
                    { name: "سرفيس الجبل الأبيض الداخلي", dest: "المدارس، المرتفعات، وسط البلد" }
                ]
            },
            {
                area: "حي معصوم",
                station: "المجمع الشمالي",
                buses: [
                    { name: "سرفيس معصوم", dest: "شارع الأوتوستراد، المستشفى الحكومي، وسط البلد" },
                    { name: "باص الحي السياسي", dest: "منطقة الإسكان، المدارس، وسط البلد" }
                ]
            },
            {
                area: "البتراوي",
                station: "مجمع الحويطات",
                buses: [
                    { name: "خطوط البتراوي", dest: "جامعة الزرقاء (مروراً)، مستشفى الزرقاء الحكومي، وسط البلد" }
                ]
            },
            {
                area: "شارع الثلاثين",
                station: "مجمع الزرقاء القديم",
                buses: [
                    { name: "باصات شارع الثلاثين", dest: "منطقة الحاووز، المصفاة، وسط البلد" },
                    { name: "سرفيس الجبل الشمالي", dest: "القمة، المدارس، وسط البلد" }
                ]
            }
        ];

        const resultsContainer = function(data) {
            const container = document.getElementById('results');
            container.innerHTML = '';
            
            if (data.length === 0) {
                container.innerHTML = `<div class="no-result">❌ عذراً، لم نجد هذه المنطقة. تأكد من كتابة اسم صحيح مثل: (الزرقاء الجديدة، عوجان، معصوم...)</div>`;
                return;
            }

            data.forEach(item => {
                let busesHTML = '';
                item.buses.forEach(b => {
                    busesHTML += `<li><span>${b.name}:</span> يوديك إلى (${b.dest})</li>`;
                });

                const card = document.createElement('div');
                card.classList.add('bus-card');
                card.innerHTML = `
                    <h3>📍 منطقة: ${item.area}</h3>
                    <p style="margin-bottom: 8px; color: #555;"><strong>نقطة التجمع (الموقف):</strong> ${item.station}</p>
                    <p style="font-weight: bold; margin-top: 10px;">جميع الباصات والأماكن التي تذهب إليها:</p>
                    <ul class="bus-list">
                        ${busesHTML}
                    </ul>
                `;
                container.appendChild(card);
            });
        };

        // عرض كل المناطق افتراضياً عند فتح الصفحة
        resultsContainer(zarqaAreas);

        // وظيفة البحث عند الكتابة أو الضغط على زر بحث
        function searchArea() {
            const query = document.getElementById('search-box').value.toLowerCase().trim();
            
            if (query === "") {
                resultsContainer(zarqaAreas);
                return;
            }

            const filtered = zarqaAreas.filter(item => 
                item.area.toLowerCase().includes(query)
            );
            
            resultsContainer(filtered);
        }
    </script>
</body>
</html>
